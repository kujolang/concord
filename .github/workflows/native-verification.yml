name: Native verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
      - name: Install released Kujo runtime without lifecycle scripts
        run: npm install --prefix "$RUNNER_TEMP/concord-runtime" --ignore-scripts --no-package-lock --no-audit --no-fund @kujolang/kujo-runtime@1.8.1
      - name: Resolve native executable
        run: |
          node --input-type=module <<'JS'
          import { createRequire } from 'node:module';
          import { appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          const require = createRequire(join(process.env.RUNNER_TEMP, 'concord-runtime', 'package.json'));
          appendFileSync(process.env.GITHUB_ENV, `KUJO_RUNTIME_BIN=${require('@kujolang/kujo-runtime').resolveKujoBinary()}\n`);
          JS
      - run: node scripts/verify-native.mjs
