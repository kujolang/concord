# Kujo Spec — Concord: Artifact Drift and Alignment Tool

name: "concord"
goal: "Build a small showcase tool called Concord that detects artifact drift and alignment issues in Kujo ecosystem repositories. Concord checks whether the important artifacts in a repo (code, CLI, docs, examples, Spec files, Eval checks, schemas, package metadata) agree with each other."
id: "a1b2c3d4-e5f6-4789-abcd-ef0123456789"
status: "in-progress"
version: "1.0.0"
created_at: "2026-05-28T08:00:00Z"
priority: "high"
background: |
  Concord is a dual-purpose project:

  1. Build a genuinely useful local developer tool for detecting artifact drift and alignment issues.
  2. Dogfood the Kujo ecosystem to identify pain points related to cross-artifact consistency.

  PatchBrief helps explain what changed.
  ShipCheck helps decide whether a repo looks ready to ship.
  Trail will help verify onboarding and HOWTO steps.

  Concord tests the missing layer: alignment between all the project truths.

  Agent-built projects often fail because the implementation changes while the surrounding artifacts do not. Examples:
  - README says `tool scan`, but the CLI exposes `tool inspect`.
  - Spec requires JSON output, but Eval only checks Markdown output.
  - Package metadata uses a different name than the docs.
  - Examples show flags that no longer exist.
  - Version metadata is inconsistent across manifest, docs, and changelog.

  Concord should become a future Kennel-friendly tool that helps package authors keep their code, docs, specs, checks, examples, and manifests synchronized.

scope: |
  MVP scope:
  - Detect whether the current directory is a repository with recognizable artifacts
  - Detect README, docs, Spec files, Eval files, manifest files, and example files
  - Extract documented commands from README/docs using fenced-code parsing
  - Compare documented commands against CLI help output (when safe to run)
  - Compare Spec acceptance criteria against Eval check names/descriptions
  - Compare package name/version/description against README/docs
  - Compare versions across manifest, README badges, and changelog
  - Check that example commands reference files that exist
  - Check that documented artifact paths correspond to actual files
  - Generate a Markdown drift report
  - Generate a JSON drift report
  - Generate recommended fix tasks
  - Return non-zero exit status when high-severity drift is found
  - Label findings with severity (critical/high/medium/low) and confidence
  - Identify likely sources of truth for key facts
  - Document ecosystem pain points discovered during development

  Out of scope for MVP:
  - Network services or APIs
  - Large external dependencies
  - AI/LLM-based drift detection (pure rule-based for MVP)
  - Full documentation parser or static analyzer
  - Full release checker (ShipCheck territory)
  - Full repo intelligence (Scout territory)
  - Diff summarization (PatchBrief territory)
  - Onboarding/HOWTO verification (Trail territory)
  - YAML/TOML parsing (regex-based field extraction only)
  - AST-level code analysis

non_goals:
  - "Full static analysis of source code"
  - "AI/LLM-powered drift detection"
  - "Network services or cloud integration"
  - "Real-time file watching or auto-fix"
  - "Plugin system for custom drift checks"
  - "Cross-repo drift analysis (single repo only for MVP)"
  - "Full Markdown parser (regex-based extraction only)"
  - "Full YAML/TOML parser (regex-based field extraction only)"

relevant_systems:
  - "kujo (core language/runtime)"
  - "kujo-kennel (package manager — manifest format)"
  - "kujo-spec (task definition — spec file format)"
  - "kujo-eval (validation framework — check definitions)"
  - "kujo-scout (codebase intelligence — artifact discovery)"
  - "kujo-dispatch (workflow orchestration — scan/report pipeline)"
  - "kujo-mcp (MCP server — agent tool exposure)"
  - "patchbrief (reference dogfood tool — patterns)"
  - "shipcheck (reference dogfood tool — patterns)"
  - "git (external dependency for repo detection)"

likely_files:
  - "concord.kujo (main entrypoint)"
  - "src/common.kujo (shared utilities: arg parsing, string helpers)"
  - "src/scanner.kujo (artifact discovery and file detection)"
  - "src/checks/cli_docs.kujo (CLI ↔ docs alignment checks)"
  - "src/checks/spec_eval.kujo (Spec ↔ Eval alignment checks)"
  - "src/checks/manifest_docs.kujo (Manifest ↔ docs alignment checks)"
  - "src/checks/version_consistency.kujo (Version consistency checks)"
  - "src/checks/example_validity.kujo (Example command validity checks)"
  - "src/checks/source_of_truth.kujo (Source-of-truth mapping)"
  - "src/reporter.kujo (Markdown and JSON report generation)"
  - "src/fix_tasks.kujo (Fix task card generation)"
  - "tests/concord_tests.kujo (test suite)"
  - "kennel.toml (package manifest)"
  - "kujo.toml (kujo project config)"
  - "concord.spec.yml (this spec)"
  - ".dogfood/concord/*.md (ecosystem testing docs)"

acceptance_criteria:
  - "`./kujo run concord.kujo scan` produces a Markdown drift report for the current directory"
  - "`./kujo run concord.kujo scan --format json` produces valid JSON output"
  - "`./kujo run concord.kujo scan --dir /path/to/other-project` scans an external repo"
  - "`./kujo run concord.kujo check cli-docs` runs CLI/docs alignment checks specifically"
  - "`./kujo run concord.kujo check spec-eval` runs Spec/Eval alignment checks specifically"
  - "`./kujo run concord.kujo check manifest` runs manifest/docs alignment checks specifically"
  - "`./kujo run concord.kujo check examples` runs example validity checks specifically"
  - "`./kujo run concord.kujo report` generates a report from the last scan"
  - "`./kujo run concord.kujo tasks` generates fix task cards"
  - "`./kujo run concord.kujo version` prints version information"
  - "`./kujo run concord.kujo help` prints usage information"
  - "Running in a directory with no drift exits with code 0"
  - "Running in a directory with high-severity drift exits with code 1"
  - "Running with invalid arguments exits with code 2 and prints error"
  - "Running in a non-directory path prints a clear error"
  - "JSON output has stable keys: findings array with id, severity, confidence, category, title, summary"
  - "All tests pass via `./kujo test`"
  - "Ecosystem dogfood reports are complete in .dogfood/concord/"

eval_requirements:
  - description: "Concord scan command succeeds on a known-good repo"
    check_type: "command_succeeds"
    params:
      command: "./kujo run concord.kujo scan --dir /path/to/other-project"
  - description: "Concord scan produces valid JSON"
    check_type: "command_succeeds"
    params:
      command: "./kujo run concord.kujo scan --dir /path/to/other-project --format json"
  - description: "Concord report contains expected sections"
    check_type: "output_contains"
    params:
      command: "./kujo run concord.kujo scan --dir /path/to/other-project"
      expected:
        - "# Concord Drift Report"
        - "## Summary"
        - "## Findings"
  - description: "Concord JSON output has findings array"
    check_type: "json_path_value"
    params:
      command: "./kujo run concord.kujo scan --dir /path/to/other-project --format json"
      path: "$.findings"
  - description: "Concord exits non-zero on invalid args"
    check_type: "exit_code"
    params:
      command: "./kujo run concord.kujo scan --nonexistent-flag"
      expected: 2
  - description: "Concord help prints usage"
    check_type: "output_contains"
    params:
      command: "./kujo run concord.kujo help"
      expected:
        - "Usage:"
        - "scan"
        - "check"

risks:
  - risk: "Regex-based YAML/TOML parsing may produce false positives/negatives"
    mitigation: "Document confidence levels. Mark regex-extracted values as medium confidence."
    severity: "medium"
  - risk: "CLI help parsing is fragile (depends on help output format)"
    mitigation: "Use loose matching. Flag parsing failures as low-confidence findings."
    severity: "medium"
  - risk: "Running external CLI commands for help output could hang or error"
    mitigation: "Use execute() with timeouts. Skip CLI help checks gracefully on failure."
    severity: "low"
  - risk: "No standard artifact alignment conventions exist in the ecosystem"
    mitigation: "Document this as a pain point. Concord's own checks are provisional."
    severity: "high"
  - risk: "May produce false positives on repos that intentionally deviate from conventions"
    mitigation: "Label findings with confidence. Allow human review before acting."
    severity: "medium"

dependencies:
  - "Kujo runtime (repo-local ./kujo wrapper; set KUJO_RUNTIME_BIN to the runtime binary)"
  - "Git (on PATH, for repo detection — optional)"

review_expectations:
  - "Review drift detection logic for false positive rates"
  - "Review report output format for clarity"
  - "Review JSON schema for stability"

human_approval_points:
  - "After initial Concord scan on real ecosystem repos"
  - "Before treating Concord findings as authoritative"
  - "Before packaging Concord for Kennel distribution"

estimated_effort: "1 day"
tags:
  - "kujo"
  - "dogfood"
  - "developer-tools"
  - "drift-detection"
  - "artifact-alignment"
  - "ecosystem-testing"
