[package]
name = "concord"
version = "0.1.0"
description = "Artifact drift and alignment checker for Kujo ecosystem projects. Dogfood showcase for the Kujo ecosystem."
license = "MIT"
authors = ["Robert DeVore <me@robertdevore.com>"]
repository = "https://github.com/kujolang/concord"
keywords = ["kujo", "drift", "alignment", "developer-tools", "dogfood"]
categories = ["developer-tools"]
readme = "README.md"

[package.status]
stage = "experimental"
stability = "early"
public_api = false
notes = "MVP dogfood build. Not yet ready for production use."

[kujo]
minimum_version = "0.1.0"
entry = "concord.kujo"
sources = ["src", "."]
includes = ["README.md", "tests"]
excludes = [".git", "kennel_packages", "dist", "build", "node_modules", ".dogfood"]

[build]
command = ""
output = "dist"
artifacts = []
